name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Auto bump release version if needed
        shell: pwsh
        run: |
          $releaseVersion = node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); process.stdout.write(pkg.releaseVersion || pkg.version);"
          if (-not $releaseVersion) {
            throw 'Failed to read package release version.'
          }

          $tag = "v$releaseVersion"
          $existingTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to query remote tag $tag."
          }

          if ([string]::IsNullOrWhiteSpace($existingTag)) {
            Write-Host "Release tag $tag does not exist. Using checked-in version."
            exit 0
          }

          $helsinkiTimeZone = [System.TimeZoneInfo]::FindSystemTimeZoneById('FLE Standard Time')
          $releaseDate = [System.TimeZoneInfo]::ConvertTimeFromUtc([System.DateTime]::UtcNow, $helsinkiTimeZone)
          $releaseDateArg = $releaseDate.ToString('yyyy-MM-dd')
          $releasePrefix = $releaseDate.ToString('yyyy.MM.dd')
          $existingReleaseTags = git ls-remote --tags origin "refs/tags/v$releasePrefix.*"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to query release tags for $releasePrefix."
          }

          $highestIndex = 0
          foreach ($line in ($existingReleaseTags -split "`n")) {
            if ($line -match "refs/tags/v$([regex]::Escape($releasePrefix))\.(\d+)$") {
              $index = [int]$Matches[1]
              if ($index -gt $highestIndex) {
                $highestIndex = $index
              }
            }
          }

          $nextIndex = $highestIndex + 1
          node .github/scripts/bump-release-version.mjs --date=$releaseDateArg --index=$nextIndex

          if ($LASTEXITCODE -ne 0) {
            throw 'Release version bump failed.'
          }

          $nextReleaseVersion = node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); process.stdout.write(pkg.releaseVersion || pkg.version);"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml

          $changes = git status --short
          if ([string]::IsNullOrWhiteSpace($changes)) {
            Write-Host 'No version files changed after release bump.'
            exit 0
          }

          git commit -m "chore: bump release version to $nextReleaseVersion [skip ci]"
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to commit release version bump.'
          }

          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to push release version bump to main. Check branch protection settings.'
          }

          Write-Host "Bumped release version from $releaseVersion to $nextReleaseVersion."

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $versionData = node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')); if (pkg.version !== tauri.version) { console.error('package.json and src-tauri/tauri.conf.json versions do not match.'); process.exit(1); } const releaseVersion = pkg.releaseVersion || pkg.version; process.stdout.write(JSON.stringify({ version: pkg.version, releaseVersion }));"
          if (-not $versionData) {
            throw 'Failed to resolve release version.'
          }
          $versionJson = $versionData | ConvertFrom-Json
          "version=$($versionJson.version)" >> $env:GITHUB_OUTPUT
          "release_version=$($versionJson.releaseVersion)" >> $env:GITHUB_OUTPUT
          "tag=v$($versionJson.releaseVersion)" >> $env:GITHUB_OUTPUT
          "commit_sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Skip if release already exists
        id: existing_release
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $match = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to query remote tags.'
          }
          if ([string]::IsNullOrWhiteSpace($match)) {
            "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "No existing release tag found for $tag."
          } else {
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Release tag $tag already exists. Skipping release build."
          }

      - name: Set up Rust
        if: steps.existing_release.outputs.exists != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install WiX Toolset
        if: steps.existing_release.outputs.exists != 'true'
        shell: pwsh
        run: choco install wixtoolset --yes --no-progress

      - name: Install frontend dependencies
        if: steps.existing_release.outputs.exists != 'true'
        shell: pwsh
        run: npm ci

      - name: Restore runtime assets
        if: steps.existing_release.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hasHashes = Test-Path 'public/card-hashes.json'
          $hasModel = Test-Path 'public/models/yolo11n-obb-riftbound.onnx'
          $hasQuantizedModel = Test-Path 'public/models/yolo11n-obb-riftbound-q8.onnx'
          $cardImage = Get-ChildItem 'public/cards' -File -Filter *.webp -ErrorAction SilentlyContinue | Select-Object -First 1

          if ($hasHashes -and $hasModel -and $hasQuantizedModel -and $cardImage) {
            Write-Host 'Runtime assets are already present in the checkout.'
            exit 0
          }

          Write-Host 'Runtime assets are missing. Downloading runtime-assets.zip from the runtime-assets GitHub release.'
          gh release download runtime-assets --pattern runtime-assets.zip --dir "$env:RUNNER_TEMP" --repo "${{ github.repository }}"

          $archivePath = Join-Path $env:RUNNER_TEMP 'runtime-assets.zip'
          if (-not (Test-Path $archivePath)) {
            throw 'runtime-assets.zip was not downloaded.'
          }

          $extractPath = Join-Path $env:RUNNER_TEMP 'runtime-assets'
          if (Test-Path $extractPath) {
            Remove-Item $extractPath -Recurse -Force
          }

          Expand-Archive -Path $archivePath -DestinationPath $extractPath -Force

          New-Item -ItemType Directory -Path 'public' -Force | Out-Null

          $hashCandidates = @(
            (Join-Path $extractPath 'public/card-hashes.json'),
            (Join-Path $extractPath 'card-hashes.json')
          )
          $modelDirCandidates = @(
            (Join-Path $extractPath 'public/models'),
            (Join-Path $extractPath 'models')
          )
          $cardDirCandidates = @(
            (Join-Path $extractPath 'public/cards'),
            (Join-Path $extractPath 'cards')
          )

          $hashSource = $hashCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          $modelSource = $modelDirCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          $cardSource = $cardDirCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $hashSource) {
            throw 'card-hashes.json was not found in runtime-assets.zip.'
          }
          if (-not $modelSource) {
            throw 'models directory was not found in runtime-assets.zip.'
          }
          if (-not $cardSource) {
            throw 'cards directory was not found in runtime-assets.zip.'
          }

          Copy-Item $hashSource 'public/card-hashes.json' -Force
          Copy-Item $modelSource 'public/models' -Recurse -Force
          Copy-Item $cardSource 'public/cards' -Recurse -Force

      - name: Set up Python for card data
        if: steps.existing_release.outputs.exists != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh bundled card data
        if: steps.existing_release.outputs.exists != 'true'
        shell: pwsh
        run: |
          python -m pip install requests Pillow opencv-python-headless numpy tqdm
          if ($LASTEXITCODE -ne 0) { throw 'Could not install card pipeline dependencies.' }
          python model/cards_scraper.py
          if ($LASTEXITCODE -ne 0) { throw 'Card data refresh failed.' }

      - name: Validate app before packaging
        if: steps.existing_release.outputs.exists != 'true'
        shell: pwsh
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { throw 'App validation failed.' }
          python -m unittest discover -s tests -p test_cards_scraper.py
          if ($LASTEXITCODE -ne 0) { throw 'Card pipeline regression failed.' }

      - name: Verify updater signing secret
        if: steps.existing_release.outputs.exists != 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY must be set so Tauri can sign updater artifacts.'
          }

      - name: Build Windows installer
        if: steps.existing_release.outputs.exists != 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = ([string]$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD).Trim()
          npm run desktop:build

      - name: Resolve and validate installer artifacts
        if: steps.existing_release.outputs.exists != 'true'
        id: installer
        shell: pwsh
        run: node .github/scripts/prepare-update-release.mjs --output="$env:RUNNER_TEMP/release-assets" --repository="${{ github.repository }}" --tag="${{ steps.version.outputs.tag }}"

      - name: Upload installer artifacts
        if: steps.existing_release.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.installer.outputs.artifact_name }}
          path: ${{ steps.installer.outputs.dir }}

      - name: Create GitHub release
        if: steps.existing_release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.release_version }}
          target_commitish: ${{ steps.version.outputs.commit_sha }}
          generate_release_notes: true
          files: ${{ steps.installer.outputs.files }}
