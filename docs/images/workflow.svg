<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Riftbound Scanner workflow</title>
  <desc id="desc">Four steps: capture a card, identify it locally, review the pending list, and export the collection.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081527"/>
      <stop offset="1" stop-color="#11152a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe49a"/>
      <stop offset="1" stop-color="#c27c1b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="330" rx="28" fill="url(#bg)" stroke="#2c4664" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="54" y="52" fill="#f4d477" font-size="13" font-weight="700" letter-spacing="4">THE WORKFLOW</text>
    <text x="54" y="84" fill="#f5f8ff" font-size="25" font-weight="700">From card on the table to collection in seconds</text>

    <g transform="translate(58 120)">
      <g transform="translate(0)">
        <circle cx="45" cy="45" r="42" fill="#102b4d" stroke="#5bd7ff" stroke-width="2"/>
        <rect x="29" y="24" width="32" height="43" rx="4" fill="#163e72" stroke="url(#gold)" stroke-width="3" transform="rotate(-8 45 45)"/>
        <path d="M20 22h9M20 22v9M70 22h-9M70 22v9M20 68h9M20 68v-9M70 68h-9M70 68v-9" stroke="#5bd7ff" stroke-width="3" fill="none"/>
        <text x="0" y="112" fill="#f5f8ff" font-size="16" font-weight="700">1. Capture</text>
        <text x="0" y="135" fill="#91a5c2" font-size="12">Camera or upload</text>
      </g>
      <path d="M185 45h80" stroke="#b58a35" stroke-width="2"/>
      <path d="m253 37 14 8-14 8" fill="none" stroke="#f4d477" stroke-width="2"/>

      <g transform="translate(300)">
        <circle cx="45" cy="45" r="42" fill="#102b4d" stroke="#5bd7ff" stroke-width="2"/>
        <path d="M45 18 67 31v28L45 72 23 59V31z" fill="#1474d0" stroke="#87ddff" stroke-width="3"/>
        <path d="m35 45 7 7 14-16" fill="none" stroke="#f8e3a0" stroke-width="4"/>
        <text x="0" y="112" fill="#f5f8ff" font-size="16" font-weight="700">2. Identify</text>
        <text x="0" y="135" fill="#91a5c2" font-size="12">Local matcher + confidence</text>
      </g>
      <path d="M485 45h80" stroke="#b58a35" stroke-width="2"/>
      <path d="m553 37 14 8-14 8" fill="none" stroke="#f4d477" stroke-width="2"/>

      <g transform="translate(600)">
        <circle cx="45" cy="45" r="42" fill="#102b4d" stroke="#5bd7ff" stroke-width="2"/>
        <rect x="23" y="25" width="44" height="40" rx="6" fill="#172b45" stroke="url(#gold)" stroke-width="3"/>
        <path d="M31 37h28M31 47h20M31 57h24" stroke="#91cfff" stroke-width="3"/>
        <text x="0" y="112" fill="#f5f8ff" font-size="16" font-weight="700">3. Review</text>
        <text x="0" y="135" fill="#91a5c2" font-size="12">Pending queue + prices</text>
      </g>
      <path d="M785 45h80" stroke="#b58a35" stroke-width="2"/>
      <path d="m853 37 14 8-14 8" fill="none" stroke="#f4d477" stroke-width="2"/>

      <g transform="translate(900)">
        <circle cx="45" cy="45" r="42" fill="#102b4d" stroke="#5bd7ff" stroke-width="2"/>
        <path d="M30 55h30M34 48V29M45 48V22M56 48V34" stroke="#8be0b0" stroke-width="5" stroke-linecap="round"/>
        <path d="m52 25 12-3-3 12" fill="none" stroke="#f4d477" stroke-width="3"/>
        <text x="0" y="112" fill="#f5f8ff" font-size="16" font-weight="700">4. Export</text>
        <text x="0" y="135" fill="#91a5c2" font-size="12">Collection-ready CSV</text>
      </g>
    </g>
  </g>
</svg>
